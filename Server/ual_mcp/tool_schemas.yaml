schema_version: '3.0'
source: Server/ual_mcp/tools.py::TOOL_DEFS
note: AUTO-GENERATED by Tools/gen_docs.py - DO NOT EDIT BY HAND.
tools:
- name: UEAssetLens.AssetSemanticToolset.SearchAssets
  description: Multi-funnel hybrid asset retrieval; returns compact TOON candidates
    + co-occurring bundle.
  inputSchema:
    type: object
    properties:
      query:
        type: string
        description: Natural-language keywords (DuckDB FTS BM25)
      asset_class:
        type: string
        description: e.g. AnimMontage, NiagaraSystem, StaticMesh
      filters:
        type: object
        description: 'Hard constraints: skeleton, duration_min/max, min/max_forward_cm,
          dominant_limb'
      domain_scope:
        type: string
        description: Directory whitelist, e.g. /Game/Characters/Knight
      limit:
        type: integer
        default: 8
- name: UEAssetLens.AssetSemanticToolset.InspectAsset
  description: Deep single-asset contract with semantic annotations; returns YAML.
  inputSchema:
    type: object
    properties:
      key:
        type: string
        description: logical_id or asset_path
    required:
    - key
- name: UEAssetLens.AssetSemanticToolset.GetCooccurringBundle
  description: Co-occurrence graph bundle recommendation; returns TOON.
  inputSchema:
    type: object
    properties:
      asset_path:
        type: string
      top_k:
        type: integer
        default: 5
    required:
    - asset_path
- name: UEAssetLens.AssetSemanticToolset.FindSimilarAssets
  description: Deterministic 16-dim fingerprint duplicate detection; returns TOON.
  inputSchema:
    type: object
    properties:
      asset_path:
        type: string
      threshold:
        type: number
        default: 0.85
    required:
    - asset_path
- name: UEAssetLens.AssetGraphToolset.GetDependencies
  description: Bounded multi-hop dependency walk (what this asset references); returns
    TOON.
  inputSchema:
    type: object
    properties:
      asset_path:
        type: string
        description: Source package path, e.g. /Game/Characters/Knight/AM_Knight_HeavySlash_02
      max_depth:
        type: integer
        default: 2
        description: BFS depth, 1..6
      edge_type:
        type: string
        default: DEPENDS_ON
        description: DEPENDS_ON | CO_OCCURS | ANY
      limit:
        type: integer
        default: 50
    required:
    - asset_path
- name: UEAssetLens.AssetGraphToolset.GetReferencers
  description: 'Reverse impact surface: who references this asset, transitively; returns
    TOON.'
  inputSchema:
    type: object
    properties:
      asset_path:
        type: string
      max_depth:
        type: integer
        default: 2
      edge_type:
        type: string
        default: DEPENDS_ON
        description: DEPENDS_ON | CO_OCCURS | ANY
      limit:
        type: integer
        default: 50
    required:
    - asset_path
- name: UEAssetLens.AssetGraphToolset.GetIndexHealth
  description: 'Index quality report: edge counts, broken/orphan/external references,
    hotspots and family distribution; returns TOON.'
  inputSchema:
    type: object
    properties:
      top_n:
        type: integer
        default: 5
- name: UEAssetLens.AssetGraphToolset.FindDuplicates
  description: Whole-index 16-dim fingerprint duplicate pairs (use InspectAsset to
    confirm); returns TOON.
  inputSchema:
    type: object
    properties:
      threshold:
        type: number
        default: 0.95
      limit:
        type: integer
        default: 20
- name: UEAssetLens.AssetSemanticToolset.SearchByFeatures
  description: Retrieve assets by normalized feature.* keys emitted by the typed extractor;
    returns TOON.
  inputSchema:
    type: object
    properties:
      feature_key:
        type: string
        description: Key substring, e.g. feature.mesh or kinematics; omit to list
          all feature.* keys
      value_contains:
        type: string
        description: Optional case-insensitive value substring
      asset_class:
        type: string
      family:
        type: string
        description: taxonomy family, e.g. Animation
      limit:
        type: integer
        default: 20
- name: UEAssetLens.AssetSemanticToolset.ListFeatureKeys
  description: Catalog of feature.* keys present in the index with asset counts; returns
    TOON.
  inputSchema:
    type: object
    properties:
      limit:
        type: integer
        default: 50
