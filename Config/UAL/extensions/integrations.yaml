# Declarative gateway-role manifest for the P1/P2 integration boundary.
# No `tool` namespace entries are defined here, so the MCP tool count is unchanged.
# External P1/P2 specs are top-level disabled, license-reviewed, Zero-VLM
# boundary records and are never executed or resolved to an executor. The two
# local deterministic offline integrations are explicitly enabled.
version: 1

rules:
  - id: gateway.integration.comfyui
    namespace: gateway
    name: comfyui_spec
    enabled: false
    license: GPL-3.0
    license_review: reviewed
    zero_vlm_boundary: true
    executed_by_ual: false
    redistributed_by_ual: false
    invoked_by_ual: false
    allow_executor_injection: false
    version: '1'
    priority: 30
    applies_to: ['*']
    capabilities: [spec, boundary, external_disabled]
    config:
      enabled: false
      license: GPL-3.0
      requires_gpu: true
      requires_cloud: false
      requires_vlm: true
      requires_network: false
      status: 规格
      process_isolation: true
      phase: P1
      source: Config/UAL/gateway/integrations.yaml
      executed_by_ual: false
      redistributed_by_ual: false
      invoked_by_ual: false
      default_status: specification_only
      reason: "GPL-3.0 external image generation needs process isolation and is disabled by Zero-VLM."
    schema:
      enabled: false
      license: GPL-3.0
      requires_gpu: true
      requires_cloud: false
      requires_vlm: true
      status: 规格
      process_isolation: true
      phase: P1
      source: Config/UAL/gateway/integrations.yaml
      asset_type_roles: [surface, vfx, ui]
      reason: "Specification only; UAL does not execute or redistribute external generative services."

