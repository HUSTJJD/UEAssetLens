name: Documentation

# GitHub Actions only generates/builds/publishes the documentation site.
# Unreal Engine is far too large for a hosted runner: C++ compilation and
# automation tests stay local (Tools/run_tests.ps1). Do not add code-checking
# jobs to this workflow.
# Push to main publishes; pull requests run the same generation + --strict
# checks (which catch broken links and generated-page drift) but never deploy.

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "Config/UAL/**"
      - "Server/schema/**"
      - "Server/ual_common/**"
      - "Server/ual_mcp/**"
      - "Server/ual_cli/**"
      - "Server/tests/**"
      - "Tools/gen_docs.py"
      - "Tools/gen_taxonomy.py"
      - "Tools/audit_tool_annotations.py"
      - "Tools/audit_engine_toolsets.py"
      - "Tools/run_tests.ps1"
      - "Tools/setup_mcp.ps1"
      - "Tools/bench_index.py"
      - "requirements*.txt"
      - "CLAUDE.md"
      - ".github/workflows/docs.yml"
      - ".github/workflows/python-ci.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "Config/UAL/**"
      - "Server/schema/**"
      - "Server/ual_common/**"
      - "Server/ual_mcp/**"
      - "Server/ual_cli/**"
      - "Server/tests/**"
      - "Tools/gen_docs.py"
      - "Tools/gen_taxonomy.py"
      - "Tools/audit_tool_annotations.py"
      - "Tools/audit_engine_toolsets.py"
      - "Tools/run_tests.ps1"
      - "Tools/setup_mcp.ps1"
      - "Tools/bench_index.py"
      - "requirements*.txt"
      - "CLAUDE.md"
      - ".github/workflows/docs.yml"
      - ".github/workflows/python-ci.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MkDocs toolchain
        run: pip install -r requirements-docs.txt
      - name: Verify generated reference is up to date
        # The generator uses stdlib + PyYAML (requirements-docs.txt); --check
        # fails when a source-of-truth file changed but generated files were
        # not regenerated (docs/reference/*.md, tool_schemas.yaml, ...).
        run: python Tools/gen_docs.py --check
      - name: Build docs
        # --strict turns warnings into a build failure, which is the only way a
        # broken internal link gets noticed before it is on the site.
        run: mkdocs build --strict --site-dir _site
      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
