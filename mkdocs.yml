site_name: UEAssetLens
site_description: 零 VLM 依赖的 Unreal Engine 资产内核 (Asset Kernel)——超大规模游戏开发中所有底层资源交互的唯一入口，覆盖资产的检索、复用、管理、开发、编辑、校验与演化全生命周期；向上服务 AI 工作流，向外提供可注册扩展与可覆盖策略。当前已交付只读语义检索中枢与 Phase 0 骨架，其余为规格目标
site_url: https://hustjjd.github.io/UEAssetLens/
repo_url: https://github.com/HUSTJJD/UEAssetLens
repo_name: HUSTJJD/UEAssetLens
edit_uri: blob/main/docs/
docs_dir: docs

theme:
  name: material
  language: zh
  logo: assets/ual.svg
  favicon: assets/ual.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: 切换到暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: 切换到亮色模式

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/HUSTJJD/UEAssetLens
      name: GitHub

nav:
  - 首页: index.md
  - 项目定位与能力规格: positioning.md
  - 快速开始: quickstart.md
  - 架构与治理:
      - 架构说明: architecture.md
      - 资产全生命周期架构规格（spec 主文）: asset-lifecycle-architecture.md
      - MCP 定位与事务层规格: mcp-positioning.md
      - 离线内核实现: kernel-implementation.md
      - 需求追踪矩阵: requirements-traceability.md
      - 性能基准: benchmarks.md
      - 事务与五层差异工件: transaction-and-diff.md
      - GameSpec / FPS 3C 工作流: gamespec-workflow.md
      - 扩展体系: extensions.md
      - CI 门禁: ci-gates.md
      - 已知限制: known-limitations.md
  - 参考（自动生成）:
      - 三层数据协议: reference/protocol.md
      - DuckDB 存储参考: reference/schema.md
      - MCP 工具参考: reference/mcp-tools.md
      - ual-cli 命令参考: reference/cli.md
  - 开发规范: agent-guide.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - meta
  - tables
  - footnotes
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

copyright: Copyright &copy; HUSTJJD · UEAssetLens v2.0
